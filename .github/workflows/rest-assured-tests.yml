name: Banking API — Rest Assured Tests

# Runs on push / pull-request to main dev branches, on a schedule, and
# on-demand via the Actions UI (with an optional pre-fetched token).
on:
  push:
    branches: [restAssuredFundamentals]
  pull_request:
    branches: [restAssuredFramework, main]
  schedule:
    # Every 6 hours — GitHub enforces ≥5 min but rarely honours sub-10 min cadences.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      access_token:
        description: 'Pre-fetched Bearer token (skips auto-login; leave blank to let BaseTest authenticate)'
        required: false
        default: ''

# Cancel a running job for the same branch/PR when a newer push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-tests:
    name: Banking API Test Suite
    runs-on: ubuntu-latest
    # 15 min covers Supabase cold-start latency + 5 chained test classes + report generation.
    timeout-minutes: 15

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Java 25 — matches <release>25</release> in pom.xml
      # -----------------------------------------------------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven   # caches ~/.m2 keyed on pom.xml hash

      # -----------------------------------------------------------------------
      # 3. Compile — fast-fail before spending time on test execution
      # -----------------------------------------------------------------------
      - name: Compile sources
        run: mvn compile test-compile --no-transfer-progress

      # -----------------------------------------------------------------------
      # 4. Run the TestNG suite
      #
      #    Token resolution order:
      #      1. workflow_dispatch input  (manual runs)
      #      2. ACCESS_TOKEN secret      (all automated runs)
      #      3. absent → BaseTest calls POST /auth/v1/token at runtime
      #
      #    testng.xml is the default suite wired into Surefire in pom.xml,
      #    so no extra -D flag is needed.
      # -----------------------------------------------------------------------
      - name: Run Banking API test suite
        env:
          ACCESS_TOKEN: ${{ inputs.access_token || secrets.ACCESS_TOKEN }}
        run: |
          TOKEN="${ACCESS_TOKEN:-}"
          if [ -n "$TOKEN" ]; then
            mvn test --no-transfer-progress -DaccessToken="$TOKEN"
          else
            mvn test --no-transfer-progress
          fi

      # -----------------------------------------------------------------------
      # 5. Generate Allure HTML report
      #
      #    allure-testng (v2.34.0) writes raw JSON results to allure-results/.
      #    The matching Allure CLI converts them to a self-contained HTML site.
      # -----------------------------------------------------------------------
      - name: Install Allure CLI and generate report
        if: always()
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.34.0/allure-2.34.0.tgz
          tar -xzf allure-2.34.0.tgz
          ./allure-2.34.0/bin/allure generate allure-results --clean -o target/allure-report

      # -----------------------------------------------------------------------
      # 6. Custom HTML report  +  GitHub Step Summary
      #
      #    generate_report.js  → target/test-report.html  (downloadable artifact)
      #    generate_summary.js → $GITHUB_STEP_SUMMARY     (inline on the run page)
      # -----------------------------------------------------------------------
      - name: Generate HTML report and job summary
        if: always()
        run: |
          node .github/scripts/generate_report.js \
            target/surefire-reports \
            target/test-report.html
          node .github/scripts/generate_summary.js \
            target/surefire-reports >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # 7. Artifacts
      # -----------------------------------------------------------------------
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-${{ github.run_number }}
          path: target/allure-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload HTML test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ github.run_number }}
          path: target/test-report.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload API logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-logs-${{ github.run_number }}
          path: src/test/resources/logs/
          if-no-files-found: ignore
          retention-days: 7
