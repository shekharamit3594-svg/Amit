name: Rest Assured API Tests

# Trigger on every push to the restAssuredFundamentals branch
on:
  push:
    branches:
      - restAssuredFundamentals

jobs:
  api-tests:
    name: Banking API Test Suite
    runs-on: ubuntu-latest

    # Timeout safeguard — Supabase cold starts can add latency; 15 min is generous
    timeout-minutes: 10

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Java 25 — matches <release>25</release> in pom.xml
      # -----------------------------------------------------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven         # caches ~/.m2 keyed on pom.xml hash

      # -----------------------------------------------------------------------
      # 3. Run the TestNG suite
      #
      #    - testng.xml is the default suite wired into the Surefire plugin,
      #      so no extra -D flag is needed beyond what pom.xml already sets.
      #    - accessToken: if the secret is set, it skips the live Supabase login
      #      (faster + avoids rate limits); if not set, BaseTest auto-logins.
      # -----------------------------------------------------------------------
      - name: Run Rest Assured tests
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ -n "$ACCESS_TOKEN" ]; then
            mvn clean test -DaccessToken="$ACCESS_TOKEN"
          else
            mvn clean test
          fi

      # -----------------------------------------------------------------------
      # 4. Generate a custom self-contained HTML report.
      #
      #    generate_report.py reads every TEST-*.xml written by Surefire,
      #    aggregates pass/fail/skip counts, renders a styled HTML page, and
      #    surfaces the full error message + stack trace for every failing test.
      #    Python 3 is pre-installed on ubuntu-latest; no extra installs needed.
      # -----------------------------------------------------------------------
      - name: Generate custom HTML report
        if: always()
        run: |
          node .github/scripts/generate_report.js \
            target/surefire-reports \
            target/test-report.html

      # -----------------------------------------------------------------------
      # 5. Upload the single HTML file as a downloadable artifact.
      #    Download from the Actions run page → open test-report.html directly
      #    in any browser — no server or extra tooling required.
      # -----------------------------------------------------------------------
      - name: Upload HTML test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ github.run_number }}
          path: target/test-report.html
          retention-days: 14

      # -----------------------------------------------------------------------
      # 6. Upload file-based logs written by UnderstandingLoggingFilters
      # -----------------------------------------------------------------------
      - name: Upload API log file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-logs-${{ github.run_number }}
          path: target/logs/
          retention-days: 7
