name: Rest Assured API Tests

# Trigger on every push to the restAssuredFundamentals branch
on:
  push:
    branches:
      - restAssuredFundamentals

jobs:
  api-tests:
    name: Banking API Test Suite
    runs-on: ubuntu-latest

    # Timeout safeguard — Supabase cold starts can add latency; 15 min is generous
    timeout-minutes: 10

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Java 25 — matches <release>25</release> in pom.xml
      # -----------------------------------------------------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven         # caches ~/.m2 keyed on pom.xml hash

      # -----------------------------------------------------------------------
      # 3. Run the TestNG suite
      #
      #    - testng.xml is the default suite wired into the Surefire plugin,
      #      so no extra -D flag is needed beyond what pom.xml already sets.
      #    - accessToken: if the secret is set, it skips the live Supabase login
      #      (faster + avoids rate limits); if not set, BaseTest auto-logins.
      # -----------------------------------------------------------------------
      - name: Run Rest Assured tests
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ -n "$ACCESS_TOKEN" ]; then
            mvn clean test -DaccessToken="$ACCESS_TOKEN"
          else
            mvn clean test
          fi

      # -----------------------------------------------------------------------
      # 4. Install Allure CLI (same version as allure-version in pom.xml)
      #    and generate a self-contained HTML report from the raw results
      #    written by AllureRestAssured during the test run.
      # -----------------------------------------------------------------------
      - name: Generate Allure HTML report
        if: always()
        run: |
          curl -sSLo allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.34.0/allure-2.34.0.tgz
          tar -xzf allure.tgz
          ./allure-2.34.0/bin/allure generate allure-results --clean -o allure-report

      # -----------------------------------------------------------------------
      # 5. Upload the generated HTML folder as a downloadable artifact.
      #    Unzip locally and open allure-report/index.html in any browser.
      # -----------------------------------------------------------------------
      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-html-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 14

      # -----------------------------------------------------------------------
      # 6. Upload file-based logs written by UnderstandingLoggingFilters
      # -----------------------------------------------------------------------
      - name: Upload API log file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-logs-${{ github.run_number }}
          path: target/logs/
          retention-days: 7
